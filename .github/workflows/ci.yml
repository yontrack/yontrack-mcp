name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  release:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: cycjimmy/semantic-release-action@v4
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: [build-and-test, release]
    if: |
      always() &&
      needs.build-and-test.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: nemerosa/yontrack-mcp
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.release.outputs.new_release_version }},enable=${{ needs.release.outputs.new_release_published == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    runs-on: ubuntu-latest
    needs: [release, docker]
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Log in to Docker Hub OCI registry
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | helm registry login registry-1.docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Package and push Helm chart
        run: |
          VERSION=${{ needs.release.outputs.new_release_version }}
          helm package helm/yontrack-mcp-chart --version "${VERSION}" --app-version "${VERSION}"
          helm push "yontrack-mcp-chart-${VERSION}.tgz" oci://registry-1.docker.io/nemerosa

  npm-publish:
    runs-on: ubuntu-latest
    needs: [build-and-test, release]
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm version ${{ needs.release.outputs.new_release_version }} --no-git-tag-version
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-release:
    runs-on: ubuntu-latest
    needs: [release, docker, helm, npm-publish]
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: write
    steps:
      - run: gh release edit v${{ needs.release.outputs.new_release_version }} --draft=false --repo ${{ github.repository }}
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Yontrack configuration"
        id: yontrack-config
        uses: nemerosa/ontrack-github-actions-cli-config@v1.3.0
        env:
          YONTRACK_URL: ${{ vars.YONTRACK_URL }}
          YONTRACK_TOKEN: ${{ secrets.YONTRACK_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Yontrack release
        if: ${{ steps.publish.outcome != '' && steps.publish.outcome != 'skipped' }}
        run: |
          yontrack build set-property release "${{ needs.release.outputs.new_release_version }}"
          yontrack validate --validation release --status ${{ steps.publish.outcome == 'success' && 'PASSED' || 'FAILED' }}
