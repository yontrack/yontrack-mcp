apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yontrack-mcp-chart.fullname" . }}
  labels:
    {{- include "yontrack-mcp-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.updateStrategy }}
    {{- if eq .Values.updateStrategy "Recreate" }}
    rollingUpdate: null
    {{- end }}
  selector:
    matchLabels:
      {{- include "yontrack-mcp-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "yontrack-mcp-chart.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: YONTRACK_URL
              value: {{ .Values.yontrack.url | quote }}
            - name: YONTRACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "yontrack-mcp-chart.secretName" . }}
                  key: YONTRACK_TOKEN
            - name: YONTRACK_MUTATIONS_ENABLED
              value: {{ .Values.yontrack.mutationsEnabled | toString | quote }}
            {{- if .Values.oauth.serverUrl }}
            - name: YONTRACK_MCP_SERVER_URL
              value: {{ .Values.oauth.serverUrl | quote }}
            - name: YONTRACK_MCP_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "yontrack-mcp-chart.secretName" . }}
                  key: YONTRACK_MCP_AUTH_PASSWORD
            {{- if .Values.persistence.enabled }}
            - name: YONTRACK_MCP_CLIENTS_FILE
              value: /data/clients.json
            {{- end }}
            {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "yontrack-mcp-chart.fullname" . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
