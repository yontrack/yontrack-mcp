{{- if and .Values.externalSecrets.enabled (not .Values.existingSecret) }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "yontrack-mcp-chart.fullname" . }}
  labels:
    {{- include "yontrack-mcp-chart.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name is required when externalSecrets.enabled is true" .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "SecretStore" }}
  target:
    name: {{ include "yontrack-mcp-chart.fullname" . }}
    creationPolicy: Owner
  data:
    - secretKey: YONTRACK_TOKEN
      remoteRef:
        key: {{ required "externalSecrets.data.yontrackToken.key is required" .Values.externalSecrets.data.yontrackToken.key }}
        {{- with .Values.externalSecrets.data.yontrackToken.property }}
        property: {{ . }}
        {{- end }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- if .Values.oauth.serverUrl }}
    - secretKey: YONTRACK_MCP_AUTH_PASSWORD
      remoteRef:
        key: {{ required "externalSecrets.data.authPassword.key is required when OAuth is enabled" .Values.externalSecrets.data.authPassword.key }}
        {{- with .Values.externalSecrets.data.authPassword.property }}
        property: {{ . }}
        {{- end }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
