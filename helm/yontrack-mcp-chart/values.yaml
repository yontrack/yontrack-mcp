replicaCount: 1

image:
  repository: nemerosa/yontrack-mcp
  pullPolicy: IfNotPresent
  # Overrides the image tag; defaults to the chart appVersion when empty
  tag: ""

# Name of an existing Secret to use for credentials.
# If set, the chart will not create a Secret and will reference this one instead.
# When OAuth2 is enabled the secret must contain YONTRACK_TOKEN and YONTRACK_MCP_AUTH_PASSWORD.
# Without OAuth2 it only needs YONTRACK_TOKEN.
existingSecret: ""

# Target Yontrack instance
yontrack:
  # Required: URL of the Yontrack instance (e.g. https://ontrack.example.com)
  url: ""
  # Required: API token for authenticating against Yontrack
  token: ""
  # Set to true to allow mutation tools (create/promote/link operations). Disabled by default.
  mutationsEnabled: false

# OAuth2 authentication (required for claude.ai)
# Both fields must be set together to enable OAuth2. When enabled, the /mcp endpoint
# requires a Bearer token obtained via the authorization code flow.
oauth:
  # Public HTTPS URL of this server (e.g. https://mcp.example.com). Must be HTTPS.
  serverUrl: ""
  # Password that users must enter in the browser authorization form.
  authPassword: ""

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /mcp
          pathType: Prefix
  tls: []

resources: {}

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

nodeSelector: {}

tolerations: []

affinity: {}
