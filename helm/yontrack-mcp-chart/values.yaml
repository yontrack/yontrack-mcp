replicaCount: 1

image:
  repository: nemerosa/yontrack-mcp
  pullPolicy: IfNotPresent
  # Overrides the image tag; defaults to the chart appVersion when empty
  tag: ""

# Name of an existing Secret to use for credentials.
# If set, the chart will not create a Secret and will reference this one instead.
# When OAuth2 is enabled the secret must contain YONTRACK_TOKEN and YONTRACK_MCP_AUTH_PASSWORD.
# Without OAuth2 it only needs YONTRACK_TOKEN.
existingSecret: ""

# External Secrets Operator (ESO) integration.
# When enabled, the chart renders an ExternalSecret CRD instead of creating a Secret directly.
# ESO will fetch the credentials from the configured backend (e.g. Vault) and write them into
# a Kubernetes Secret with the same name the chart would otherwise create.
# existingSecret takes precedence: if set, this block is ignored.
externalSecrets:
  enabled: false
  # How often ESO should refresh the secret from the backend.
  refreshInterval: "1h"
  secretStoreRef:
    # Required: name of the SecretStore or ClusterSecretStore to use.
    name: ""
    # Kind of the store: SecretStore (namespace-scoped) or ClusterSecretStore (cluster-scoped).
    kind: SecretStore
  data:
    yontrackToken:
      # Required: path/key in the backend that holds the Yontrack API token.
      # Example for Vault KV v2: "secret/yontrack"
      key: ""
      # Optional: sub-field within the secret entry (leave empty if the value is the whole entry).
      property: ""
    authPassword:
      # Required when OAuth2 is enabled: path/key in the backend for the auth password.
      key: ""
      property: ""

# Target Yontrack instance
yontrack:
  # Required: URL of the Yontrack instance (e.g. https://ontrack.example.com)
  url: ""
  # Optional: API token for authenticating against Yontrack
  token: ""
  # Set to true to allow mutation tools (create/promote/link operations). Disabled by default.
  mutationsEnabled: false

# OAuth2 authentication (required for claude.ai)
# Both serverUrl and authPassword must be set together to enable OAuth2. When enabled,
# the /mcp endpoint requires a Bearer token obtained via the authorization code flow.
oauth:
  # Public HTTPS URL of this server (e.g. https://mcp.example.com). Must be HTTPS.
  serverUrl: ""
  # Password that users must enter in the browser authorization form.
  authPassword: ""

# Persistent storage for OAuth2 client registrations.
# Enabled by default when OAuth2 is in use so that registered clients survive pod restarts.
# The volume is mounted at /data; the clients file is written to /data/clients.json.
persistence:
  enabled: true
  size: 10Mi
  # Storage class to use. Leave empty to use the cluster default.
  storageClass: ""
  accessMode: ReadWriteOnce

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /mcp
          pathType: Prefix
  tls: []

resources: {}

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

nodeSelector: {}

tolerations: []

affinity: {}
